name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [desktop-app]

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Test and build with Nuitka
        shell: pwsh
        run: |
          ./scripts/ensure-env.ps1 -Dev
          ./.venv/Scripts/python.exe -m pytest -q
          ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DayDistiller-Windows-x64
          path: dist/DayDistiller-Windows-x64.zip
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
          cache: pip
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install build dependencies
        run: |
          brew install ffmpeg ccache
          python3 -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Test and build native arm64 app
        run: |
          python3 -m pytest -q
          ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DayDistiller-macOS-AppleSilicon
          path: dist/DayDistiller-macOS-AppleSilicon.zip
          if-no-files-found: error
