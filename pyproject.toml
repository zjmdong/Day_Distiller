[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day-distiller-client"
version = "0.1.0"
description = "Windows USB Link client for Day Distiller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "PySide6>=6.7",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
day-distiller-client = "day_distiller_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]
