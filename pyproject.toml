[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day-distiller-client"
version = "0.2.0"
description = "Windows USB Link client for Day Distiller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25",
    "numpy>=2.0",
    "openai>=2.0",
    "pillow>=10",
    "pydantic>=2.9",
    "pyserial>=3.5",
    "PySide6>=6.7",
    "pywin32>=306; platform_system == 'Windows'",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
day-distiller-client = "day_distiller_client.app:main"
day-distiller-train-motion = "day_distiller_client.motion_training:main"

[tool.setuptools.packages.find]
where = ["src"]
